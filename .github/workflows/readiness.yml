name: readiness

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      # The issue text is read from the event file, never pasted into the script.
      - run: uv run --locked --no-dev task-agent ready --event "$GITHUB_EVENT_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
