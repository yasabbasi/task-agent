name: close-out

# pull_request_target runs this file from the default branch with a token that can label, for
# pull requests from forks too. It never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-out:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: check out task-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TASK_AGENT_REPO
          ref: TASK_AGENT_SHA # TASK_AGENT_TAG
          path: task-agent
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
          ignore-empty-workdir: true
      # The pull request's text is read from the event file, never pasted into the script.
      - run: >-
          uv run --project task-agent --locked --no-dev
          task-agent close-out --bot "TASK_AGENT_BOT" --event "$GITHUB_EVENT_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
